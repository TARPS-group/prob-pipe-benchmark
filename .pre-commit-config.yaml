# This ruff rev is the single source of truth for the version: the CI lint job
# reads it from here, and tests/test_tooling_versions.py asserts the `dev` extra
# pin in pyproject.toml matches it, so the two cannot drift (this repo has no
# uv.lock to pin ruff automatically).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        name: ruff (lint)
        args: ["--output-format=full"]
      - id: ruff-format
        name: ruff (format)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.ipynb$'
      - id: end-of-file-fixer
        exclude: '\.ipynb$'
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2000"]
